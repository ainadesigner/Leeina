name: Apply Discovery UX Enhancements

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-discovery-enhancements.mjs

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply discovery enhancements
        run: node scripts/apply-discovery-enhancements.mjs

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit generated app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Add Global home section and opportunity sorting"
          git push origin HEAD:main
