name: Apply 30-Day Session Persistence

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-session-30d.py
      - .github/workflows/apply-session-30d.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply 30-day session persistence
        run: python scripts/apply-session-30d.py

      - name: Validate JavaScript and required session logic
        run: |
          set -euo pipefail
          node --check app.js
          grep -q "AICH_SESSION_30D_V1" app.js
          grep -q "SESSION_MAX_AGE_MS=30\*24\*60\*60\*1000" app.js
          grep -q "grant_type=refresh_token" app.js
          grep -q "refreshPromise" app.js
          grep -q "aich_session_started_at" app.js
          grep -q "/app.js?v=105" index.html
          grep -q "AI Contest Hub v1.4" index.html
          echo "SESSION_30D_VALID"

      - name: Commit generated session update
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js index.html; then
            echo "No app changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Add secure 30-day login persistence"
          git push origin HEAD:main
