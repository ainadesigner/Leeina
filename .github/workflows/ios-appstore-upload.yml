name: iOS App Store Build and Upload

on:
  push:
    branches: [agent/ios-capacitor]
    paths: [ios-release-trigger.txt]
  workflow_dispatch:

jobs:
  build-upload-ios:
    runs-on: macos-15
    permissions:
      contents: read

    env:
      APP_BUNDLE_ID: com.aicontesthub.app
      APP_NAME: AI Contest Hub
      APP_VERSION: '1.0'
      APP_BUILD: '1'
      APPLE_TEAM_ID: Q4TL332FPY

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Normalize App Store Connect credentials
        env:
          KEY_ID_RAW: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID_RAW: ${{ secrets.ASC_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$KEY_ID_RAW"; test -n "$ISSUER_ID_RAW"; test -n "$PRIVATE_KEY"
          KEY_ID="$(printf '%s' "$KEY_ID_RAW" | tr -d '[:space:]')"
          ISSUER_ID="$(printf '%s' "$ISSUER_ID_RAW" | tr -d '[:space:]')"
          echo "$ISSUER_ID" | grep -Eq '^[0-9A-Fa-f-]{36}$'
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          printf '%s' "$PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate and generate Capacitor iOS project
        run: |
          set -euo pipefail
          node --check app.js
          node --check native-bridge.js
          node --check android-detail-save.js
          grep -q 'com.aicontesthub.app' capacitor.config.json
          grep -q '"@capacitor/ios": "8.4.2"' package.json
          npm run ios:init
          test -d ios/App/App.xcodeproj

      - name: Configure app icon and verify bundled UI
        run: |
          set -euo pipefail
          node scripts/reconstruct-icons.mjs
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          sips -z 1024 1024 assets/icon-play.png --out "$ICONSET/AppIcon-512@2x.png" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json')
          data=json.loads(p.read_text()); images=data.setdefault('images',[])
          found=False
          for item in images:
              if item.get('size')=='1024x1024' or item.get('idiom')=='universal':
                  item.update({'filename':'AppIcon-512@2x.png','idiom':'universal','platform':'ios','size':'1024x1024'}); found=True
          if not found: images.append({'filename':'AppIcon-512@2x.png','idiom':'universal','platform':'ios','size':'1024x1024'})
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          W=ios/App/App/public
          for f in index.html app.js native-bridge.js ios-shell.css android-card-tuning.css android-detail-save.css; do test -f "$W/$f"; done
          grep -q 'AI Contest Hub v1.8' "$W/index.html"
          grep -q 'aspect-ratio:3/4' "$W/android-card-tuning.css"
          grep -q 'detailSave' "$W/android-detail-save.css"

      - name: Generate distribution private key and CSR
        run: |
          set -euo pipefail
          openssl genrsa -out "$RUNNER_TEMP/distribution.key" 2048
          openssl req -new -key "$RUNNER_TEMP/distribution.key" -out "$RUNNER_TEMP/distribution.csr" -subj '/CN=AI Contest Hub Distribution/O=AI Contest Hub/C=KR'
          chmod 600 "$RUNNER_TEMP/distribution.key"
          openssl req -in "$RUNNER_TEMP/distribution.csr" -noout -verify

      - name: Create Apple Distribution certificate and App Store profile
        env:
          KEY_ID_RAW: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID_RAW: ${{ secrets.ASC_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet PyJWT cryptography requests
          CSR_PATH="$RUNNER_TEMP/distribution.csr" CERT_PATH="$RUNNER_TEMP/distribution.cer" PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision" META_PATH="$RUNNER_TEMP/apple-signing-meta.json" "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
          import os,time,jwt,requests,json,base64,sys
          key_id=''.join(os.environ['KEY_ID_RAW'].split()); issuer=''.join(os.environ['ISSUER_ID_RAW'].split())
          private=os.environ['PRIVATE_KEY']; csr=open(os.environ['CSR_PATH']).read()
          token=jwt.encode({'iss':issuer,'iat':int(time.time()),'exp':int(time.time())+600,'aud':'appstoreconnect-v1'},private,algorithm='ES256',headers={'kid':key_id,'typ':'JWT'})
          h={'Authorization':f'Bearer {token}','Content-Type':'application/json'}; base='https://api.appstoreconnect.apple.com/v1'
          meta={'certificate_id':None,'profile_id':None}
          def req(method,url,**kw):
              r=requests.request(method,url,headers=h,timeout=60,**kw)
              if r.status_code not in (200,201,204):
                  print(f'Apple API {method} {url}: {r.status_code}\n{r.text[:3000]}'); raise SystemExit(1)
              return r
          b=req('GET',f'{base}/bundleIds?filter[identifier]=com.aicontesthub.app&limit=1').json()['data']
          if len(b)!=1: raise SystemExit('Bundle ID com.aicontesthub.app not found or not unique')
          bundle_id=b[0]['id']
          payload={'data':{'type':'certificates','attributes':{'certificateType':'DISTRIBUTION','csrContent':csr}}}
          r=req('POST',f'{base}/certificates',json=payload).json()['data']; meta['certificate_id']=r['id']
          open(os.environ['META_PATH'],'w').write(json.dumps(meta))
          base64.b64decode(r['attributes']['certificateContent']).__class__
          open(os.environ['CERT_PATH'],'wb').write(base64.b64decode(r['attributes']['certificateContent']))
          profile_name=f'AI Contest Hub App Store CI {int(time.time())}'
          pp={'data':{'type':'profiles','attributes':{'name':profile_name,'profileType':'IOS_APP_STORE'},'relationships':{'bundleId':{'data':{'type':'bundleIds','id':bundle_id}},'certificates':{'data':[{'type':'certificates','id':meta['certificate_id']}]}}}}
          p=req('POST',f'{base}/profiles',json=pp).json()['data']; meta.update({'profile_id':p['id'],'profile_name':p['attributes']['name'],'profile_uuid':p['attributes']['uuid']})
          open(os.environ['META_PATH'],'w').write(json.dumps(meta))
          open(os.environ['PROFILE_PATH'],'wb').write(base64.b64decode(p['attributes']['profileContent']))
          print('Created Apple Distribution certificate and IOS_APP_STORE profile')
          PY
          test -s "$RUNNER_TEMP/distribution.cer"; test -s "$RUNNER_TEMP/appstore.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          test -n "$PROFILE_UUID"; test -n "$PROFILE_NAME"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Install distribution certificate and profile
        run: |
          set -euo pipefail
          KC_PASS="$(openssl rand -hex 24)"
          openssl x509 -inform DER -in "$RUNNER_TEMP/distribution.cer" -out "$RUNNER_TEMP/distribution.pem"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/distribution.key" -in "$RUNNER_TEMP/distribution.pem" -out "$RUNNER_TEMP/distribution.p12" -passout pass:"$KC_PASS"
          security create-keychain -p "$KC_PASS" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$KC_PASS" "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -k "$RUNNER_TEMP/build.keychain-db" -P "$KC_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$RUNNER_TEMP/build.keychain-db"
          security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/appstore.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Archive manually signed App Store app
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/AIContestHub.xcarchive"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" PRODUCT_NAME="$APP_NAME" MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          test -d "$ARCHIVE"
          echo "IOS_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Export App Store IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict><key>${APP_BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          <key>stripSwiftSymbols</key><true/><key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          EXPORT_DIR="$RUNNER_TEMP/export"
          xcodebuild -exportArchive -archivePath "$IOS_ARCHIVE" -exportPath "$EXPORT_DIR" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA="$(find "$EXPORT_DIR" -maxdepth 1 -name '*.ipa' -print -quit)"; test -f "$IPA"
          cp "$IPA" "$RUNNER_TEMP/AI-Contest-Hub-1.0-build1.ipa"
          echo "IPA_PATH=$RUNNER_TEMP/AI-Contest-Hub-1.0-build1.ipa" >> "$GITHUB_ENV"

      - name: Validate IPA
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/ipa-check"; mkdir -p "$TMP"; unzip -q "$IPA_PATH" -d "$TMP"
          APP="$(find "$TMP/Payload" -maxdepth 1 -name '*.app' -print -quit)"; test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx "$APP_BUNDLE_ID"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$APP_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx "$APP_BUILD"
          codesign --verify --deep --strict --verbose=2 "$APP"
          shasum -a 256 "$IPA_PATH"

      - name: Upload IPA to App Store Connect
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-contest-hub-ios-1.0-build1
          path: ${{ runner.temp }}/AI-Contest-Hub-1.0-build1.ipa
          if-no-files-found: error

      - name: Cleanup Apple signing resources after failure
        if: failure()
        env:
          KEY_ID_RAW: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID_RAW: ${{ secrets.ASC_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set +e
          test -f "$RUNNER_TEMP/apple-signing-meta.json" || exit 0
          python3 -m venv "$RUNNER_TEMP/cleanup-venv"
          "$RUNNER_TEMP/cleanup-venv/bin/pip" install --quiet PyJWT cryptography requests
          META_PATH="$RUNNER_TEMP/apple-signing-meta.json" "$RUNNER_TEMP/cleanup-venv/bin/python" - <<'PY'
          import os,json,time,jwt,requests
          m=json.load(open(os.environ['META_PATH'])); kid=''.join(os.environ['KEY_ID_RAW'].split()); iss=''.join(os.environ['ISSUER_ID_RAW'].split())
          t=jwt.encode({'iss':iss,'iat':int(time.time()),'exp':int(time.time())+600,'aud':'appstoreconnect-v1'},os.environ['PRIVATE_KEY'],algorithm='ES256',headers={'kid':kid,'typ':'JWT'})
          h={'Authorization':f'Bearer {t}'}; base='https://api.appstoreconnect.apple.com/v1'
          if m.get('profile_id'): print('delete profile',requests.delete(f"{base}/profiles/{m['profile_id']}",headers=h,timeout=30).status_code)
          if m.get('certificate_id'): print('revoke certificate',requests.delete(f"{base}/certificates/{m['certificate_id']}",headers=h,timeout=30).status_code)
          PY
