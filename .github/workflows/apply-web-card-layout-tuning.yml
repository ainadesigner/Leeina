name: Apply Web Card Layout Tuning

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apply-card-layout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Apply exact CSS-only card tuning
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text()
          replacements = [
              (
                  '.poster{aspect-ratio:4/5;background:linear-gradient(145deg,#173e33,#071b16);position:relative;overflow:hidden}',
                  '.poster{aspect-ratio:3/4;background:linear-gradient(145deg,#173e33,#071b16);position:relative;overflow:hidden}'
              ),
              (
                  '.poster img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}',
                  '.poster img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;position:relative;z-index:1}'
              ),
              (
                  '.dday{position:absolute;right:12px;bottom:12px;z-index:3;border:1px solid var(--pink);background:rgba(255,90,165,.13);color:var(--pink2);font-weight:950;border-radius:999px;padding:7px 10px}',
                  '.dday{position:absolute;right:8px;bottom:8px;z-index:3;border:1px solid var(--pink);background:rgba(255,90,165,.13);color:var(--pink2);font-size:11px;line-height:1;font-weight:950;border-radius:999px;padding:5px 8px}'
              ),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:60]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -q 'aspect-ratio:3/4' style.css
          grep -q 'object-fit:contain;object-position:center' style.css
          grep -q 'font-size:11px;line-height:1' style.css

      - name: Commit CSS-only change and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-web-card-layout-tuning.yml
          git add style.css
          git commit -m "Tune web poster ratio and D-Day badge"
          git push origin HEAD:main
