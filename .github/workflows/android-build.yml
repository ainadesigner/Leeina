name: Android Build

on:
  push:
    branches: [agent/android-capacitor]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npm run android:init

      - name: Show Android SDK levels
        run: |
          grep -R "compileSdk" -n android | head -20 || true
          grep -R "targetSdk" -n android | head -20 || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Sign release AAB
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

          KEYSTORE="$RUNNER_TEMP/aich-upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          SOURCE_AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$SOURCE_AAB" || { echo "Release AAB not found"; exit 1; }
          SIGNED_AAB="android/app/build/outputs/bundle/release/ai-contest-hub-release-signed.aab"
          cp "$SOURCE_AAB" "$SIGNED_AAB"

          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$SIGNED_AAB" \
            "$ANDROID_KEY_ALIAS"

          jarsigner -verify -strict -verbose -certs "$SIGNED_AAB"
          rm -f "$KEYSTORE"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-contest-hub-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ai-contest-hub-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed release AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ai-contest-hub-release-aab-signed
          path: android/app/build/outputs/bundle/release/ai-contest-hub-release-signed.aab
          if-no-files-found: error
