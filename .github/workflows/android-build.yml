name: Android Build

on:
  push:
    branches: [agent/android-capacitor]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Validate app JavaScript
        run: |
          set -euo pipefail
          node --check app.js
          grep -q "AICH_DISCOVERY_SORT_V1" app.js
          grep -q "마감임박순" app.js
          grep -q "상금 높은 순" app.js
          grep -q "globalGrid" app.js
          echo "DISCOVERY_UX_SOURCE_VALID"

      - name: Test native API bridge
        run: npm run test:native-bridge

      - name: Smoke test Supabase public API
        run: |
          set -euo pipefail
          ANON_KEY="$(node -e "const fs=require('fs');const s=fs.readFileSync('native-bridge.js','utf8');const m=s.match(/const LEGACY_ANON_KEY='([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1]);")"
          echo "ANON_KEY_LENGTH=${#ANON_KEY}"
          STATUS="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/contests-smoke.json" \
            --write-out '%{http_code}' \
            'https://pkfaaezbwnkgjfgpovzo.supabase.co/rest/v1/contests?status=eq.live&select=id&limit=1' \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")"
          echo "SUPABASE_HTTP_STATUS=$STATUS"
          cat "$RUNNER_TEMP/contests-smoke.json"
          echo
          test "$STATUS" = "200"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/contests-smoke.json','utf8'));if(!Array.isArray(d))process.exit(1);"
          echo "SUPABASE_PUBLIC_API_OK"

      - name: Generate Android project
        run: npm run android:init

      - name: Verify packaged web assets
        run: |
          set -euo pipefail
          PACKAGED_BRIDGE="android/app/src/main/assets/public/native-bridge.js"
          PACKAGED_APP="android/app/src/main/assets/public/app.js"
          test -f "$PACKAGED_BRIDGE"
          test -f "$PACKAGED_APP"
          cmp native-bridge.js "$PACKAGED_BRIDGE"
          cmp app.js "$PACKAGED_APP"
          grep -q "SUPABASE_ORIGIN" "$PACKAGED_BRIDGE"
          grep -q "LEGACY_ANON_KEY" "$PACKAGED_BRIDGE"
          grep -q "Authorization" "$PACKAGED_BRIDGE"
          grep -q "localhost" "$PACKAGED_BRIDGE"
          grep -q "AICH_DISCOVERY_SORT_V1" "$PACKAGED_APP"
          grep -q "마감임박순" "$PACKAGED_APP"
          grep -q "상금 높은 순" "$PACKAGED_APP"
          grep -q "globalGrid" "$PACKAGED_APP"
          echo "PACKAGED_WEB_ASSETS_VALID"

      - name: Set Android version 4
        run: |
          set -euo pipefail
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 4/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.3"/' android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle
          grep -qE 'versionCode[[:space:]]+4' android/app/build.gradle
          grep -qE 'versionName[[:space:]]+"1\.3"' android/app/build.gradle

      - name: Show Android SDK levels
        run: |
          grep -R "compileSdk" -n android | head -20 || true
          grep -R "targetSdk" -n android | head -20 || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify release bundle contents
        run: |
          set -euo pipefail
          SOURCE_AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$SOURCE_AAB"
          unzip -p "$SOURCE_AAB" base/assets/public/native-bridge.js > "$RUNNER_TEMP/native-bridge-from-aab.js"
          unzip -p "$SOURCE_AAB" base/assets/public/app.js > "$RUNNER_TEMP/app-from-aab.js"
          cmp native-bridge.js "$RUNNER_TEMP/native-bridge-from-aab.js"
          cmp app.js "$RUNNER_TEMP/app-from-aab.js"
          grep -q "https://pkfaaezbwnkgjfgpovzo.supabase.co" "$RUNNER_TEMP/native-bridge-from-aab.js"
          grep -q "LEGACY_ANON_KEY" "$RUNNER_TEMP/native-bridge-from-aab.js"
          grep -q "Authorization" "$RUNNER_TEMP/native-bridge-from-aab.js"
          grep -q "localhost" "$RUNNER_TEMP/native-bridge-from-aab.js"
          grep -q "AICH_DISCOVERY_SORT_V1" "$RUNNER_TEMP/app-from-aab.js"
          grep -q "마감임박순" "$RUNNER_TEMP/app-from-aab.js"
          grep -q "상금 높은 순" "$RUNNER_TEMP/app-from-aab.js"
          grep -q "globalGrid" "$RUNNER_TEMP/app-from-aab.js"
          echo "RELEASE_BUNDLE_CONTENTS_VALID"

      - name: Validate signing inputs
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_KEYSTORE_SHA256: 76985cea622be0ec9bae6072ad2b64b19c7072b32c6e9cde5ad888956494510f
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "SIGNING_SECRET_MISSING: ANDROID_KEYSTORE_BASE64"; exit 11; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "SIGNING_SECRET_MISSING: ANDROID_KEYSTORE_PASSWORD"; exit 12; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "SIGNING_SECRET_MISSING: ANDROID_KEY_ALIAS"; exit 13; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "SIGNING_SECRET_MISSING: ANDROID_KEY_PASSWORD"; exit 14; }

          KEYSTORE="$RUNNER_TEMP/aich-upload-keystore.jks"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE"; then
            echo "SIGNING_BASE64_INVALID"
            exit 21
          fi

          ACTUAL_SHA256="$(sha256sum "$KEYSTORE" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_KEYSTORE_SHA256" ]; then
            echo "SIGNING_KEYSTORE_MISMATCH"
            exit 22
          fi

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "SIGNING_STORE_PASSWORD_INVALID"
            exit 23
          fi

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "SIGNING_ALIAS_INVALID"
            exit 24
          fi

          echo "SIGNING_INPUTS_VALID"

      - name: Sign release AAB
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/aich-upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE"

          SOURCE_AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$SOURCE_AAB" || { echo "Release AAB not found"; exit 1; }
          SIGNED_AAB="android/app/build/outputs/bundle/release/AI-Contest-Hub-1.3-build4-signed.aab"
          cp "$SOURCE_AAB" "$SIGNED_AAB"

          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$SIGNED_AAB" \
            "$ANDROID_KEY_ALIAS"

          jarsigner -verify -verbose -certs "$SIGNED_AAB"
          sha256sum "$SIGNED_AAB" | tee "$SIGNED_AAB.sha256"
          keytool -printcert -jarfile "$SIGNED_AAB" | grep -E 'Owner:|SHA256:'
          rm -f "$KEYSTORE"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-contest-hub-debug-apk-v4-final
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ai-contest-hub-release-aab-unsigned-v4-final
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed release AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ai-contest-hub-release-aab-signed-v4-final
          path: |
            android/app/build/outputs/bundle/release/AI-Contest-Hub-1.3-build4-signed.aab
            android/app/build/outputs/bundle/release/AI-Contest-Hub-1.3-build4-signed.aab.sha256
          if-no-files-found: error
