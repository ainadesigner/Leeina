name: Android Build

on:
  push:
    branches: [agent/android-capacitor]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npm run android:init

      - name: Show Android SDK levels
        run: |
          grep -R "compileSdk" -n android | head -20 || true
          grep -R "targetSdk" -n android | head -20 || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-contest-hub-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ai-contest-hub-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
