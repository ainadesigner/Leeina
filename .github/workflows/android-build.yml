name: Android Build 1.5 Custom Icon

on:
  push:
    branches: [agent/android-capacitor]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Validate source and custom icon package
        run: |
          set -euo pipefail
          node --check app.js
          node --check admin.js
          node --check recovery.js
          node --check scripts/prepare-capacitor.mjs
          grep -q 'AICH_DISCOVERY_SORT_V1' app.js
          grep -q 'AICH_SESSION_30D_V1' app.js
          grep -q 'AICH_SESSION_INTEGRATION_V1' app.js
          grep -qF 'SESSION_MAX_AGE_MS=30*24*60*60*1000' app.js
          grep -q 'grant_type=refresh_token' app.js
          grep -q 'window.AICHSession' app.js
          grep -q '마감임박순' app.js
          grep -q '상금 높은 순' app.js
          grep -q '"version": "1.5.0"' package.json
          grep -q 'npm run android:icon' package.json
          test "$(find assets -maxdepth 1 -name 'icon-play.b64.part*' -type f | wc -l)" -eq 5
          test "$(find assets -maxdepth 1 -name 'icon-foreground.b64.part*' -type f | wc -l)" -eq 4
          javac scripts/GenerateAndroidIcons.java
          rm -f scripts/GenerateAndroidIcons.class
          cat assets/icon-play.b64.part* | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/icon-play.png"
          cat assets/icon-foreground.b64.part* | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/icon-foreground.png"
          test "$(sha256sum "$RUNNER_TEMP/icon-play.png" | awk '{print $1}')" = 'e8244395b02b5f0412b0d205f10687085e3b2203a194ec4ee82cf6d04d9ba808'
          test "$(sha256sum "$RUNNER_TEMP/icon-foreground.png" | awk '{print $1}')" = '425ebec5fed6ad1d850758657ece6ed2a9bfe485ac45545fe51fc2c6ff7e74d5'
          echo SOURCE_AND_ICON_PACKAGE_VALID

      - name: Test native API bridge
        run: npm run test:native-bridge

      - name: Smoke test Supabase public API
        run: |
          set -euo pipefail
          KEY="$(node -e "const s=require('fs').readFileSync('native-bridge.js','utf8');const m=s.match(/const LEGACY_ANON_KEY='([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          CODE="$(curl -sS -o "$RUNNER_TEMP/smoke.json" -w '%{http_code}' 'https://pkfaaezbwnkgjfgpovzo.supabase.co/rest/v1/contests?status=eq.live&select=id&limit=1' -H "apikey: $KEY" -H "Authorization: Bearer $KEY")"
          test "$CODE" = 200
          node -e "const d=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/smoke.json'));if(!Array.isArray(d))process.exit(1)"
          echo SUPABASE_PUBLIC_API_OK

      - name: Generate Android project and custom icons
        run: npm run android:init

      - name: Verify packaged app and launcher assets
        run: |
          set -euo pipefail
          W=android/app/src/main/assets/public
          for f in native-bridge.js app.js admin.js recovery.js index.html; do test -f "$W/$f"; done
          cmp app.js "$W/app.js"
          cmp admin.js "$W/admin.js"
          cmp recovery.js "$W/recovery.js"
          grep -q 'AI Contest Hub v1.5' "$W/index.html"
          grep -q 'AICH_SESSION_30D_V1' "$W/app.js"
          grep -q 'AICH_SESSION_INTEGRATION_V1' "$W/app.js"
          R=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png ic_launcher_monochrome.png; do test -f "$R/mipmap-$d/$f"; done; done
          test -f "$R/mipmap-anydpi-v26/ic_launcher.xml"
          test -f "$R/mipmap-anydpi-v33/ic_launcher.xml"
          grep -q ic_launcher_foreground "$R/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q ic_launcher_monochrome "$R/mipmap-anydpi-v33/ic_launcher.xml"
          test -f assets/play-store-icon-512.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for p,w,h in [
            ('assets/play-store-icon-512.png',512,512),
            ('android/app/src/main/res/mipmap-mdpi/ic_launcher.png',48,48),
            ('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png',192,192),
            ('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png',432,432)]:
            b=Path(p).read_bytes()
            if b[:8]!=b'\x89PNG\r\n\x1a\n' or struct.unpack('>II',b[16:24])!=(w,h): raise SystemExit('invalid icon '+p)
          print('ICON_DIMENSIONS_VALID')
          PY

      - name: Set Android version 6
        run: |
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 6/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.5"/' android/app/build.gradle
          grep -qE 'versionCode[[:space:]]+6' android/app/build.gradle
          grep -qE 'versionName[[:space:]]+"1\.5"' android/app/build.gradle

      - name: Build release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Verify release bundle
        run: |
          set -euo pipefail
          A=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$A"
          unzip -p "$A" base/assets/public/app.js > "$RUNNER_TEMP/app.js"
          unzip -p "$A" base/assets/public/index.html > "$RUNNER_TEMP/index.html"
          cmp app.js "$RUNNER_TEMP/app.js"
          grep -q 'AI Contest Hub v1.5' "$RUNNER_TEMP/index.html"
          grep -q 'AICH_SESSION_30D_V1' "$RUNNER_TEMP/app.js"
          unzip -Z1 "$A" > "$RUNNER_TEMP/aab-files.txt"
          grep -q 'base/res/mipmap-mdpi-v4/ic_launcher.png' "$RUNNER_TEMP/aab-files.txt"
          grep -q 'base/res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png' "$RUNNER_TEMP/aab-files.txt"
          grep -q 'base/res/mipmap-anydpi-v26/ic_launcher.xml' "$RUNNER_TEMP/aab-files.txt"
          echo RELEASE_BUNDLE_VALID

      - name: Validate upload signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS"; test -n "$SP"; test -n "$ALIAS"; test -n "$KP"
          printf '%s' "$KS" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/upload.jks"
          test "$(sha256sum "$RUNNER_TEMP/upload.jks" | awk '{print $1}')" = '76985cea622be0ec9bae6072ad2b64b19c7072b32c6e9cde5ad888956494510f'
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$SP" -alias "$ALIAS" >/dev/null

      - name: Sign and verify final AAB
        env:
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SRC=android/app/build/outputs/bundle/release/app-release.aab
          OUT=android/app/build/outputs/bundle/release/AI-Contest-Hub-1.5-build6-signed.aab
          cp "$SRC" "$OUT"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.jks" -storepass "$SP" -keypass "$KP" "$OUT" "$ALIAS"
          jarsigner -verify -verbose -certs "$OUT" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/signature.txt"
          sha256sum "$OUT" | tee "$OUT.sha256"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload Play Console package
        uses: actions/upload-artifact@v4
        with:
          name: ai-contest-hub-1.5-build6-play-package
          path: |
            android/app/build/outputs/bundle/release/AI-Contest-Hub-1.5-build6-signed.aab
            android/app/build/outputs/bundle/release/AI-Contest-Hub-1.5-build6-signed.aab.sha256
            assets/play-store-icon-512.png
          if-no-files-found: error
