name: iOS Signing API Permission Check

on:
  push:
    branches: [agent/ios-capacitor]
  workflow_dispatch:

jobs:
  check-signing-api:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Apple Certificates API access
        env:
          KEY_ID_RAW: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID_RAW: ${{ secrets.ASC_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$PRIVATE_KEY" > "$KEY_FILE"
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet PyJWT cryptography requests
          KEY_FILE="$KEY_FILE" "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
          import os, time, jwt, requests, sys
          key_id=''.join(os.environ['KEY_ID_RAW'].split())
          issuer=''.join(os.environ['ISSUER_ID_RAW'].split())
          with open(os.environ['KEY_FILE'],'r') as f:
              private=f.read()
          token=jwt.encode(
              {'iss':issuer,'iat':int(time.time()),'exp':int(time.time())+600,'aud':'appstoreconnect-v1'},
              private,
              algorithm='ES256',
              headers={'kid':key_id,'typ':'JWT'}
          )
          headers={'Authorization':f'Bearer {token}'}
          urls=[
              'https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=com.aicontesthub.app&limit=1',
              'https://api.appstoreconnect.apple.com/v1/certificates?limit=1',
              'https://api.appstoreconnect.apple.com/v1/profiles?limit=1',
          ]
          for url in urls:
              r=requests.get(url,headers=headers,timeout=30)
              print(url.split('/v1/')[1].split('?')[0],r.status_code)
              if r.status_code != 200:
                  print(r.text[:1000])
                  sys.exit(1)
          print('APPLE_SIGNING_API_ACCESS_OK')
          PY
